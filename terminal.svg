<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="820" height="714" viewBox="0 0 820 714" role="img" aria-label="Linux terminal of Fakhri" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text { font-family: 'Fira Code', 'JetBrains Mono', 'Courier New', monospace; font-size: 16px; white-space: pre; }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 0%, 50% { opacity: 1; } 50.01%, 100% { opacity: 0; } }
    .user { fill: #a6e3a1; font-weight: 700; }
    .sep  { fill: #cdd6f4; }
    .dir  { fill: #89b4fa; font-weight: 700; }
    .cmd  { fill: #f9e2af; }
    .out  { fill: #cdd6f4; }
    .name { fill: #94e2d5; font-weight: 700; }
    .err  { fill: #f38ba8; }
    .warn { fill: #fab387; }
    .dim  { fill: #6c7086; }
    .mag  { fill: #cba6f7; font-weight: 700; }
  </style>

  <!-- Terminal window -->
  <rect x="2" y="2" width="816" height="710" rx="12" fill="#1e1e2e" stroke="#45475a" stroke-width="2"/>
  <path d="M2 14 a12 12 0 0 1 12 -12 h792 a12 12 0 0 1 12 12 v34 h-816 z" fill="#313244"/>
  <circle cx="26" cy="26" r="7" fill="#ff5f56"/>
  <circle cx="50" cy="26" r="7" fill="#ffbd2e"/>
  <circle cx="74" cy="26" r="7" fill="#27c93f"/>
  <text x="410" y="31" text-anchor="middle" class="dim" style="font-size:14px">fakhri@github: ~</text>

  <!-- Terminal lines: one line per row, edit the text inside the tspan tags -->
  <text x="24" y="90"><tspan class="user">fakhri@github</tspan><tspan class="sep">:</tspan><tspan class="dir">~</tspan><tspan class="sep">$ </tspan><tspan class="cmd">whoami</tspan></text>
  <text x="24" y="114"><tspan class="name">fakhri</tspan></text>
  <text x="24" y="152"><tspan class="user">fakhri@github</tspan><tspan class="sep">:</tspan><tspan class="dir">~</tspan><tspan class="sep">$ </tspan><tspan class="cmd">ls</tspan></text>
  <text x="24" y="176"><tspan class="dir">about</tspan><tspan class="out">  </tspan><tspan class="dir">hobbies</tspan><tspan class="out">  </tspan><tspan class="dir">skills</tspan><tspan class="out">  </tspan><tspan class="dir">learning</tspan></text>
  <text x="24" y="214"><tspan class="user">fakhri@github</tspan><tspan class="sep">:</tspan><tspan class="dir">~</tspan><tspan class="sep">$ </tspan><tspan class="cmd">ls hobbies/</tspan></text>
  <text x="24" y="238"><tspan class="dir">Ngoding</tspan><tspan class="out">  </tspan><tspan class="dir">Gaming</tspan><tspan class="out">  </tspan><tspan class="dir">Editing</tspan><tspan class="out">  </tspan><tspan class="dir">LearningNewThings</tspan></text>
  <text x="24" y="276"><tspan class="user">fakhri@github</tspan><tspan class="sep">:</tspan><tspan class="dir">~</tspan><tspan class="sep">$ </tspan><tspan class="cmd">cd about</tspan></text>
  <text x="24" y="300"><tspan class="user">fakhri@github</tspan><tspan class="sep">:</tspan><tspan class="dir">~/about</tspan><tspan class="sep">$ </tspan><tspan class="cmd">cat role.txt</tspan></text>
  <text x="24" y="324"><tspan class="out">Student at Pasundan University</tspan></text>
  <text x="24" y="362"><tspan class="user">fakhri@github</tspan><tspan class="sep">:</tspan><tspan class="dir">~/about</tspan><tspan class="sep">$ </tspan><tspan class="cmd">cat location.txt</tspan></text>
  <text x="24" y="386"><tspan class="out">Bandung, Indonesia 🇮🇩</tspan></text>
  <text x="24" y="424"><tspan class="user">fakhri@github</tspan><tspan class="sep">:</tspan><tspan class="dir">~/about</tspan><tspan class="sep">$ </tspan><tspan class="cmd">cd ../learning</tspan></text>
  <text x="24" y="448"><tspan class="user">fakhri@github</tspan><tspan class="sep">:</tspan><tspan class="dir">~/learning</tspan><tspan class="sep">$ </tspan><tspan class="cmd">cat currently_learning.txt</tspan></text>
  <text x="24" y="472"><tspan class="err">cat: currently_learning.txt: Permission denied</tspan></text>
  <text x="24" y="510"><tspan class="user">fakhri@github</tspan><tspan class="sep">:</tspan><tspan class="dir">~/learning</tspan><tspan class="sep">$ </tspan><tspan class="cmd">cd ../skills</tspan></text>
  <text x="24" y="534"><tspan class="user">fakhri@github</tspan><tspan class="sep">:</tspan><tspan class="dir">~/skills</tspan><tspan class="sep">$ </tspan><tspan class="cmd">cat skills.txt</tspan></text>
  <text x="24" y="558"><tspan class="err">cat: skills.txt: Permission denied</tspan></text>
  <text x="24" y="596"><tspan class="user">fakhri@github</tspan><tspan class="sep">:</tspan><tspan class="dir">~/skills</tspan><tspan class="sep">$ </tspan><tspan class="cmd">sudo cat skills.txt</tspan></text>
  <text x="24" y="620"><tspan class="warn">[sudo] password for fakhri: </tspan><tspan class="out">********</tspan></text>
  <text x="24" y="644"><tspan class="err">fakhri is not in the sudoers file.</tspan><tspan class="warn"> This incident will be reported.</tspan></text>
  <text x="24" y="682"><tspan class="user">fakhri@github</tspan><tspan class="sep">:</tspan><tspan class="dir">~/skills</tspan><tspan class="sep">$ </tspan><tspan class="cursor mag">█</tspan></text>
</svg>
